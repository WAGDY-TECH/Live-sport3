plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.wagdytech.livesports'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.wagdytech.livesports"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.2.0"

        buildConfigField "String", "ADMOB_INTERSTITIAL_ID", '"ca-app-pub-2183960712618957/1254216698"'
        buildConfigField "String", "REMOTE_CONFIG_URL", '"https://raw.githubusercontent.com/WAGDY-TECH/Live-sport3/main/app-config.json"'
        manifestPlaceholders = [admobAppId: "ca-app-pub-2183960712618957~2877968756"]
    }

    signingConfigs {
        release {
            storeFile rootProject.file('release.keystore')
            storePassword 'livesports2024'
            keyAlias 'livesports'
            keyPassword 'livesports2024'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.google.android.gms:play-services-ads:23.1.0'
}
